<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE Chem</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
    <!-- Progress Bar -->
    <div id="progress-bar"></div>

    <!-- Header -->
    <header class="site-header">
        <div class="header-content">
            <h1 class="site-title">DSE Chem</h1>
            <div class="controls">
                <div class="control-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="speech-toggle" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">SPEECH</span>
                    </label>
                </div>
                <div class="control-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="translate-toggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">TRANSLATE</span>
                    </label>
                </div>
                <div class="control-group">
                    <label class="toggle-label">
                        <input type="checkbox" id="theme-toggle">
                        <span class="toggle-slider"></span>
                        <span class="toggle-text">Dark</span>
                    </label>
                </div>
                <button id="toc-toggle" class="toc-button">☰ 目錄</button>
                <button id="back-to-list" class="toc-button back-button-header hidden">← 返回</button>
            </div>
        </div>
    </header>

    <!-- Sidebar TOC -->
    <aside id="sidebar-toc" class="sidebar-toc hidden">
        <div class="toc-header">
            <h3>目錄</h3>
            <button id="toc-close" class="toc-close">×</button>
        </div>
        <div id="toc-content" class="toc-content"></div>
    </aside>

    <!-- Overlay for mobile TOC -->
    <div id="overlay" class="overlay"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div id="file-list-container" class="file-list-container">
            <h1>DSE Chemistry Notes</h1>
            <p>Select a file to read:</p>
            <div id="file-list" class="file-list">
                <!-- Files will be loaded here -->
            </div>
        </div>
        <article id="content-container" class="content-container hidden">
            <div class="loading">Loading...</div>
        </article>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/mhchem.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
